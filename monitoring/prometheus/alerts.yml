# Reglas de alerta de ejemplo. Se ven en Prometheus, pestana Alerts.
groups:
  - name: infraestructura
    rules:
      - alert: BackendCaido
        expr: up{job="backends"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "El backend {{ $labels.instance }} no responde"

      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (le) (rate(flask_http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "La latencia p95 supera 500 ms"

      - alert: RespuestasConError
        expr: sum(rate(flask_http_request_total{status=~"5.."}[1m])) > 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Hay respuestas con codigo 5xx"
