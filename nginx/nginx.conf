# Formato de log propio: muestra a QUE backend se envio cada peticion
log_format balanceo '$remote_addr "$request" -> backend=$upstream_addr '
                    'status=$status tiempo=$request_time s';

# Grupo de backends. backend1, backend2 y backend3 son nombres de servicio
# del docker-compose: Docker los resuelve a la IP de cada contenedor.
# Sin otra indicacion Nginx reparte por turnos (round robin).
# Por defecto, tras un fallo Nginx deja de usar ese backend unos 10 s
# y despues lo vuelve a intentar.
upstream backend_pool {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
}

server {
    listen 80;
    access_log /dev/stdout balanceo;

    location / {
        proxy_pass http://backend_pool;

        # Cabeceras para que el backend sepa quien es el cliente real
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si un backend falla, la peticion se reintenta en el siguiente
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Cabecera para depuracion: IP y puerto del backend que respondio
        add_header X-Upstream $upstream_addr always;
    }
}

# Puerto interno de estado (NO se publica en docker-compose).
# Lo lee nginx-exporter y lo convierte al formato de Prometheus.
server {
    listen 8088;
    access_log off;

    location /stub_status {
        stub_status;
    }
}
